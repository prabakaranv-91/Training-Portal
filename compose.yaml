name: fit-squad

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      AUTH_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}:${HTTPS_PORT:-18443}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
    volumes:
      - app_data:/app/data
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /home/app:uid=10001,gid=10001,mode=700,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/session', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      HTTPS_PORT: ${HTTPS_PORT:-18443}
    ports:
      - "${HTTP_PORT:-18080}:80"
      - "${HTTPS_PORT:-18443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  private:

volumes:
  app_data:
  caddy_data:
  caddy_config: